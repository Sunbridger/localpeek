name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & typecheck
    # macOS 托管运行器当前不可用；测试/构建在 Linux 上执行，打包仍在 macOS 本地进行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build:
    name: Build
    # macOS 托管运行器当前不可用；测试/构建在 Linux 上执行，打包仍在 macOS 本地进行
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
