appId: io.github.sunbridger.localpeek
productName: LocalPeek
electronDist: node_modules/electron/dist
compression: maximum
electronLanguages:
  - en
  - zh_CN
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!docs/**'
  - '!.github/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.gitignore,.editorconfig,.gitattributes,README.md,CONTRIBUTING.md,SECURITY.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,package-lock.json}'
asar: true
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  notarize: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Sunbridger
dmg:
  artifactName: LocalPeek-${version}-${arch}.${ext}
npmRebuild: false
